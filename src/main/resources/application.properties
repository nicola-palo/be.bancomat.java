spring.application.name=atm

# --- Environment (dev/prod) ---
atm.production=${ATM_PRODUCTION:false}

# --- CORS allowed origins (comma-separated) ---
# Dev: localhost only | Prod: add your GitHub Pages and AWS domains
atm.cors.allowed-origins=${ATM_CORS_ORIGINS:http://localhost:*,https://localhost:*}

# --- Database (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome

# --- Demo seed data (disable in prod) ---
atm.seed.enabled=${ATM_SEED_ENABLED:true}

# --- Security ---
# Brute force protection: max PIN attempts before card is blocked
# Set to 0 to disable (not recommended for production)
atm.security.max-pin-attempts=${ATM_MAX_PIN_ATTEMPTS:3}

# Internal API key for BE.CHAT -> BE communication
atm.internal.api-key=${ATM_INTERNAL_API_KEY:atm-internal-secret-key-change-in-prod}

# --- Auth (JWT HMAC secret) ---
# IMPORTANT: change this in real deployments (>= 32 chars). For local dev it's OK.
atm.jwt.secret=${ATM_JWT_SECRET:change-me-change-me-change-me-change-me}
atm.jwt.issuer=atm-be
atm.jwt.ttl-seconds=3600

# --- HTTPS/TLS (encrypt FE <-> BE) ---
# To enable HTTPS locally, generate the keystore described in HELP.md and set enabled=true.
server.ssl.enabled=false
server.port=8080
server.ssl.key-store=ssl/atm-keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=atm
