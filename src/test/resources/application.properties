spring.datasource.url=jdbc:h2:mem:atm_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

atm.seed.enabled=false
atm.jwt.secret=test-secret-test-secret-test-secret-test-secret
atm.jwt.issuer=atm-be-test
atm.jwt.ttl-seconds=60

# Brute force protection: 3 attempts for tests
atm.security.max-pin-attempts=3

server.ssl.enabled=false
